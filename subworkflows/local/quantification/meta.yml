name: "quantification"
description: |
  Generates count matrices from input FASTQ files.
keywords:
  - quantification
  - counts
  - rpm
  - srnas
components:
  - fastqc
  - multiqc
input:
  - ch_input:
      description: |
        FASTQ files with small RNA sequences.
        Structure: [ val(meta), path(fastq_file) ]
  - type:
      description: |
        Specifies the type of data input.
        Possible values: 'raw' or 'rpm'
  - counts_project_matrix:
      description: |
        Boolean flag indicating whether to generate a project-level counts matrix.
        Values: true or false
output:
  - group_matrix:
      description: |
        TSV file containing the counts matrix generated from the input FASTQ files.
        Structure: [ val(meta), path(tsv_file) ]
  - versions:
      description: |
        Files containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@antoglz"
maintainers:
  - "@antoglz"