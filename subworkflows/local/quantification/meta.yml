name: "quantification"
description: |
  Generates count matrices from input FASTQ files.
keywords:
  - quantification
  - counts
  - rpm
  - srnas
components:
  - fastqc
  - multiqc
input:
  - ch_input:
      description: |
        FASTQ files with small RNA sequences.
        Structure: [ val(meta), path(fastq_file) ]
  - type:
      description: |
        Specifies the type of data input.
        Possible values: 'raw' or 'rpm'
        Type: string
  - not_in_memory:
      description: |
        Boolean flag indicating that SQLite should use a file on disk rather
        than loading the database into memory when generating the count matrix.
        Type: boolean
output:
  - group_matrix:
      description: |
        TSV file containing the counts matrix generated from the input FASTQ files.
        Structure: [ val(meta), path(tsv_file) ]
  - versions:
      description: |
        Files containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@antoglz"
maintainers:
  - "@antoglz"