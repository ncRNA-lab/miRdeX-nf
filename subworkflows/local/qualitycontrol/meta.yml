name: "quality_control"
description: |
  Executes FastQC for individual sample reports and MultiQC for aggregated
  summary reports.
keywords:
  - quality
  - fastqc
  - multiqc
components:
  - fastqc
  - multiqc
input:
  - ch_input:
      description: |
        FASTQ file. Metadata includes species and project.
        Structure: [ val(meta), path(fasta_file) ]
  - val_skip_multiqc:
      description: |
        Boolean flag indicating whether to skip the execution of MultiQC.
        Values: true or false
  - val_type:
      description: |
        Specifies the type of input library (FASTQ file).
        Possible values: Raw or Trimmed
output:
  - fastqc_zip:
      description: |
        ZIP archive containing FASTQC results.
        Metadata includes species and project.
        Structure: [ val(meta), path(zip_file) ]
  - fastqc_html:
      description: |
        HTML report generated by FASTQC.
        Metadata includes species and project.
        Structure: [ val(meta), path(zip_file) ]
  - multiqc_report:
      description: |
        MultiQC aggregated report in HTML format.
        Can be null if no report is generated.
        Structure: [ path(multiqc_file) ]
  - versions:
      description: |
        Files containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@antoglz"
maintainers:
  - "@antoglz"